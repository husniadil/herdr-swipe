id = "herdr-swipe"
name = "Herdr Swipe"
version = "0.1.1"
min_herdr_version = "0.8.0"
description = "Trackpad gestures for Herdr: move between panes, tabs and spaces, and jump to the agent waiting on you"
platforms = ["macos"]

# No [[build]]: the daemon declares its dependencies inline (PEP 723), so
# `uv run --script` needs no preparation step. scripts/setup.sh exists only as
# a fallback for a machine with python3 but no uv, and run.sh calls it then.

# Detaches the daemon and exits, which is what Herdr expects of a startup
# command. Being launched by Herdr is also what makes the daemon inherit the
# terminal's Accessibility grant instead of asking for its own.
[[startup]]
id = "daemon"
command = ["scripts/run.sh"]

[[actions]]
id = "restart"
title = "Restart gesture daemon"
contexts = ["workspace"]
command = ["scripts/run.sh"]

# Herdr has no shutdown hook, so disabling or unlinking the plugin leaves the
# daemon running. This is the way to actually turn the gestures off.
[[actions]]
id = "stop"
title = "Stop gesture daemon"
contexts = ["workspace"]
command = ["scripts/stop.sh"]
