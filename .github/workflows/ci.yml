name: ci

on:
  push:
  pull_request:

# Versions are written out rather than floated, actions included. Astral
# publishes the release tag before the moving major alias, so `@v10` can be
# missing while v10.0.1 is out; an exact tag cannot be in that state.
#
# Versions are written out rather than floated. Ruff's rule set moves between
# releases, so an unpinned lint job fails on rules the development machine has
# never seen; uv is pinned for the same reason, one step further down. Both are
# the versions in use on the machine this was written on -- keep them in step
# when that machine moves.

jobs:
  test:
    # The navigation policy and the gesture machine are pure logic: no socket,
    # no trackpad, no Cocoa. They run anywhere, on both ends of the range the
    # script claims to support -- the floor, and what development actually uses.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.15"
          # There is no lockfile to key a cache on -- dependencies are declared
          # inline in daemon.py -- so a cache here could never be invalidated.
          enable-cache: false
      # uv fetches the interpreter itself, so this is the same command that
      # runs locally, not a second way of doing it through setup-python.
      - run: >
          uv run --python ${{ matrix.python }} --no-project
          python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.14.14"
          args: check --select E,F,W,I,UP,B --line-length 88
      # The shell scripts are where a real bug hid once: a pkill pattern that
      # could never match, so every restart quietly left the old daemon running.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck --shell=sh scripts/*.sh

  daemon-imports:
    # Not a behaviour test: gesture recognition needs a trackpad, a hand, and
    # an Accessibility grant, none of which a runner has. This only asserts the
    # daemon's dependencies resolve and its modules still import on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.15"
          # There is no lockfile to key a cache on -- dependencies are declared
          # inline in daemon.py -- so a cache here could never be invalidated.
          enable-cache: false
      - run: uv run --script --no-project daemon.py --check-imports
